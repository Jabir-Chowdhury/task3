<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
    <header>
        <div class="profile-header">
            <img class="cover-photo" src="image/cover photo for practice.png" alt="cover photo">
            <img class="profile-pic" src="image/Screenshot 2026-09-27 173857.png" alt="profile picture">
        </div>
    </header>
    <main class="profile-description">
        <h1 class="profile-name">Jabir Chowdhury</h1>
        <h2 class="profile-role">Web Developer</h2>
        <p>Learning web development and building project consistency.</p>

    </main>
    <ul class="social-links">
        <li>
            <a href="https://github.com/">
                <img class="image-icon" src="image/github.svg" alt="github">
            
                <span class="tooltip">github</span>
            </a>
        </li>
        <li>
            <a href="https://www.linkedin.com/feed/">
                <img class="image-icon" src="image/logo-linkedin (1).svg" alt="linkedin">
                <span class="tooltip">Linkedin</span>
            </a>
        </li>
        <li>
            <a href="https://www.youtube.com/">
                <img class="image-icon" src="image/youtube.svg" alt="youtube">
                <span class="tooltip">Youtube</span>
            </a>
        </li>
    </ul>
    <button type="button" class="profile-button">
        <span>View profile</span>
        <img src="image/arrow-forward-outline.svg" alt="forward arrow">
    </button>
    </div>
</body>
</html>
